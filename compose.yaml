
services:
  db:
    image: postgres:17
    container_name: quota-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quota_user
      POSTGRES_PASSWORD: quota_password
      POSTGRES_DB: quota_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
