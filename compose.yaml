
services:
  db:
    image: postgres:17
    container_name: quota-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quota_user
      POSTGRES_PASSWORD: quota_password
      POSTGRES_DB: quota_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_user -d quota_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: quota_user
      DB_PASSWORD: quota_password
      DB_NAME: quota_service
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
